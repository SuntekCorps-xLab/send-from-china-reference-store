<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Animated desktop shopping-agent experience</title>
  <desc id="desc">A desktop catalog remains visible while a contextual agent drawer opens, receives a brief, returns an illustrative catalog card, and keeps Shopify as the purchase handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f1e6"/><stop offset=".55" stop-color="#eef3eb"/><stop offset="1" stop-color="#eed8c7"/></linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a3035"/><stop offset="1" stop-color="#194447"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14383a" flood-opacity=".17"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.ink{fill:#0b3035}.muted{fill:#6b7873}.white{fill:#fff}.label{font-size:17px;font-weight:750}.small{font-size:13px;font-weight:600}.eyebrow{font-size:12px;font-weight:850;letter-spacing:2px}
      .ask{transform-box:fill-box;transform-origin:center;animation:ask 9s ease infinite}.scrim{animation:scrim 9s ease infinite}.drawer{transform-box:fill-box;transform-origin:right center;animation:drawer 9s cubic-bezier(.65,0,.2,1) infinite}.query{animation:query 9s ease infinite}.reply{animation:reply 9s ease infinite}.card{transform-box:fill-box;transform-origin:center;animation:card 9s cubic-bezier(.2,.8,.2,1) infinite}.handoff{animation:handoff 9s ease infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.5s ease-in-out infinite}.float{animation:float 4.5s ease-in-out infinite}.f2{animation-delay:-1.4s}.f3{animation-delay:-2.8s}
      @keyframes ask{0%,8%,100%{transform:scale(1)}12%,18%{transform:scale(1.08);filter:drop-shadow(0 0 12px #ef8b50)}}
      @keyframes scrim{0%,18%{opacity:0}30%,100%{opacity:.2}}@keyframes drawer{0%,18%{transform:translateX(560px);opacity:0}30%,100%{transform:translateX(0);opacity:1}}
      @keyframes query{0%,32%{opacity:0;transform:translateY(10px)}42%,100%{opacity:1;transform:translateY(0)}}@keyframes reply{0%,45%{opacity:0;transform:translateY(10px)}55%,100%{opacity:1;transform:translateY(0)}}
      @keyframes card{0%,56%{opacity:0;transform:translateY(18px) scale(.97)}68%,100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes handoff{0%,70%{opacity:0}81%,100%{opacity:1}}
      @keyframes spark{0%,100%{transform:scale(.84);opacity:.65}50%{transform:scale(1.14) rotate(12deg);opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @media (prefers-reduced-motion:reduce){.ask,.scrim,.drawer,.query,.reply,.card,.handoff,.spark,.float{animation:none!important}.scrim{opacity:.2}.drawer{transform:none;opacity:1}.query,.reply,.card,.handoff{opacity:1}}
    </style>
  </defs>
  <rect width="1600" height="780" rx="38" fill="url(#bg)"/><circle cx="90" cy="110" r="150" fill="#ed8853" opacity=".26"/><circle cx="1508" cy="704" r="190" fill="#98ad96" opacity=".34"/>
  <g filter="url(#shadow)"><rect x="55" y="42" width="1490" height="690" rx="30" fill="#fffdfa"/><rect x="55" y="42" width="1490" height="76" rx="30" fill="url(#nav)"/><path d="M55 86v32h1490V86" fill="url(#nav)"/></g>
  <g class="sans">
    <circle cx="96" cy="80" r="18" fill="#fff"/><path d="M96 66l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#e85d22" class="spark"/><text x="127" y="87" class="label white">SEND FROM CHINA</text>
    <text x="716" y="86" class="small white">Catalog</text><text x="805" y="86" class="small white">Collections</text><text x="912" y="86" class="small white">Account</text>
    <g class="ask"><rect x="1362" y="60" width="145" height="42" rx="21" fill="#f18a4e"/><text x="1390" y="87" class="small white">Ask Agent ✦</text></g>
    <text x="94" y="164" class="eyebrow" fill="#c54c18">DESKTOP · CONTEXT PRESERVED</text><text x="94" y="204" class="serif ink" font-size="38">The catalog stays visible.</text>
    <rect x="94" y="232" width="770" height="52" rx="26" fill="#f4f2ec" stroke="#ced8d1"/><circle cx="123" cy="258" r="9" fill="none" stroke="#20484a" stroke-width="3"/><path d="M130 265l9 9" stroke="#20484a" stroke-width="3"/><text x="155" y="264" class="small muted">desk organizers</text><rect x="785" y="241" width="68" height="34" rx="17" fill="#173f40"/><text x="804" y="263" class="small white">Search</text>
    <g class="float"><rect x="94" y="318" width="242" height="328" rx="21" fill="#f6f1e8" stroke="#d7ddd7"/><rect x="111" y="335" width="208" height="184" rx="15" fill="#e2e7dd"/><path d="M157 461h116v34H157zm21-83h74v88h-74z" fill="#8d765f"/><rect x="126" y="545" width="145" height="11" rx="5.5" fill="#173f40"/><rect x="126" y="570" width="94" height="8" rx="4" fill="#c1cac3"/><text x="126" y="614" class="label ink">$29</text><circle cx="296" cy="607" r="12" fill="#789174"/></g>
    <g class="float f2"><rect x="360" y="318" width="242" height="328" rx="21" fill="#f6f1e8" stroke="#d7ddd7"/><rect x="377" y="335" width="208" height="184" rx="15" fill="#efded2"/><path d="M425 466h110l-10-86h-90z" fill="#df652c"/><path d="M447 383c0-31 67-31 67 0" fill="none" stroke="#a63f19" stroke-width="8"/><rect x="392" y="545" width="135" height="11" rx="5.5" fill="#173f40"/><rect x="392" y="570" width="106" height="8" rx="4" fill="#c1cac3"/><text x="392" y="614" class="label ink">$34</text><circle cx="562" cy="607" r="12" fill="#dc672d"/></g>
    <g class="float f3"><rect x="626" y="318" width="242" height="328" rx="21" fill="#f6f1e8" stroke="#d7ddd7"/><rect x="643" y="335" width="208" height="184" rx="15" fill="#dfebe7"/><path d="M689 463h116v31H689zm19-66h78v70h-78z" fill="#31595b"/><circle cx="747" cy="426" r="16" fill="#9db7ab"/><rect x="658" y="545" width="151" height="11" rx="5.5" fill="#173f40"/><rect x="658" y="570" width="88" height="8" rx="4" fill="#c1cac3"/><text x="658" y="614" class="label ink">$24</text><circle cx="828" cy="607" r="12" fill="#31595b"/></g>
    <rect x="890" y="118" width="655" height="614" fill="#14383a" class="scrim"/>
    <g class="drawer">
      <rect x="970" y="118" width="575" height="614" fill="#fffdf9" stroke="#ced8d1"/><path d="M970 196h575" stroke="#d7dfda"/>
      <circle cx="1012" cy="157" r="23" fill="#173f40"/><path d="M1012 141l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#ff9857" class="spark"/><text x="1050" y="151" class="eyebrow" fill="#c54c18">PRODUCT CONCIERGE</text><text x="1050" y="179" class="serif ink" font-size="25">Shopping Agent</text><rect x="1484" y="137" width="39" height="39" rx="11" fill="#f1f0eb"/><path d="M1496 149l15 15m0-15l-15 15" stroke="#173f40" stroke-width="2"/>
      <g class="query"><rect x="1002" y="222" width="511" height="61" rx="17" fill="#f0eee7"/><text x="1024" y="246" class="eyebrow muted">YOU</text><text x="1024" y="269" class="small ink">A practical desk gift under $40</text></g>
      <g class="reply"><text x="1003" y="326" class="eyebrow" fill="#5e8366">SEND FROM CHINA</text><text x="1003" y="354" class="label ink">One governed catalog match</text><text x="1003" y="378" class="small muted">Catalog evidence first · no hidden write</text></g>
      <g class="card"><rect x="1002" y="402" width="511" height="177" rx="20" fill="#f7f3eb" stroke="#d3dbd5"/><rect x="1018" y="418" width="132" height="145" rx="14" fill="#e2e7dd"/><path d="M1042 522h84v26h-84zm14-66h56v69h-56z" fill="#8b745e"/><text x="1171" y="438" class="eyebrow" fill="#588064">CATALOG MATCH</text><text x="1171" y="471" class="label ink">Modular desk organizer</text><text x="1171" y="498" class="small muted">Published record · compact</text><text x="1171" y="536" class="serif ink" font-size="27">$29.00</text><rect x="1327" y="516" width="154" height="32" rx="16" fill="#e4ece2"/><text x="1353" y="537" class="small ink">View details</text></g>
      <g class="handoff"><rect x="1002" y="602" width="511" height="55" rx="16" fill="#173f40"/><circle cx="1031" cy="629.5" r="13" fill="#88b57c"/><path d="M1024 630l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="1057" y="635" class="label white">Continue to verified Shopify product</text><text x="1003" y="689" class="small muted">Shopify re-checks variant, price, inventory and cart.</text></g>
    </g>
    <rect x="94" y="681" width="400" height="30" rx="15" fill="#e7eee8"/><circle cx="113" cy="696" r="6" fill="#70a368"/><text x="128" y="701" class="small ink">Illustrative animation · no commerce write</text>
  </g>
</svg>
