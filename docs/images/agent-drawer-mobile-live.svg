<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Animated mobile shopping-agent experience</title>
  <desc id="desc">A mobile shopper keeps product context while an accessible full-height agent sheet rises, shows an illustrative catalog match, and hands the shopper back to Shopify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf3ec"/><stop offset=".52" stop-color="#f9f3e9"/><stop offset="1" stop-color="#efd7c7"/></linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a3035"/><stop offset="1" stop-color="#194447"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#14383a" flood-opacity=".2"/></filter>
    <clipPath id="screen"><rect x="537" y="46" width="526" height="706" rx="54"/></clipPath>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.ink{fill:#0b3035}.muted{fill:#6b7873}.white{fill:#fff}.label{font-size:17px;font-weight:760}.small{font-size:13px;font-weight:600}.eyebrow{font-size:12px;font-weight:850;letter-spacing:2px}
      .tap{transform-box:fill-box;transform-origin:center;animation:tap 9s ease infinite}.sheet{animation:sheet 9s cubic-bezier(.65,0,.2,1) infinite}.query{animation:query 9s ease infinite}.reply{animation:reply 9s ease infinite}.card{transform-box:fill-box;transform-origin:center;animation:card 9s cubic-bezier(.2,.8,.2,1) infinite}.handoff{animation:handoff 9s ease infinite}.step{animation:step 9s ease infinite}.s2{animation-delay:-6s}.s3{animation-delay:-3s}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.6s ease-in-out infinite}
      @keyframes tap{0%,8%,100%{transform:scale(1)}12%,18%{transform:scale(1.1);filter:drop-shadow(0 0 12px #f18a4e)}}@keyframes sheet{0%,18%{transform:translateY(570px);opacity:0}31%,100%{transform:translateY(0);opacity:1}}
      @keyframes query{0%,33%{opacity:0;transform:translateY(10px)}43%,100%{opacity:1;transform:translateY(0)}}@keyframes reply{0%,46%{opacity:0;transform:translateY(10px)}57%,100%{opacity:1;transform:translateY(0)}}@keyframes card{0%,57%{opacity:0;transform:translateY(16px) scale(.97)}69%,100%{opacity:1;transform:none}}@keyframes handoff{0%,71%{opacity:0}82%,100%{opacity:1}}
      @keyframes step{0%,12%,100%{opacity:.4}18%,38%{opacity:1}}@keyframes spark{0%,100%{transform:scale(.84);opacity:.65}50%{transform:scale(1.14) rotate(12deg);opacity:1}}
      @media (prefers-reduced-motion:reduce){.tap,.sheet,.query,.reply,.card,.handoff,.step,.spark{animation:none!important}.sheet{transform:none;opacity:1}.query,.reply,.card,.handoff,.step{opacity:1}}
    </style>
  </defs>
  <rect width="1600" height="800" rx="38" fill="url(#bg)"/><circle cx="148" cy="112" r="170" fill="#e7824e" opacity=".22"/><circle cx="1478" cy="714" r="210" fill="#93aa91" opacity=".32"/>
  <g class="sans">
    <text x="70" y="90" class="eyebrow" fill="#c54c18">MOBILE · ONE CONTINUOUS JOURNEY</text><text x="70" y="137" class="serif ink" font-size="39">Context stays in hand.</text>
    <g class="step"><rect x="70" y="202" width="355" height="118" rx="23" fill="#fffdfa" stroke="#d3ddd6"/><circle cx="112" cy="241" r="22" fill="#e9efe8"/><text x="100" y="249" font-size="23">🛍️</text><text x="149" y="238" class="eyebrow" fill="#557861">01 · BROWSE</text><text x="149" y="271" class="label ink">Keep product context</text><text x="149" y="296" class="small muted">Catalog and brief stay available.</text></g>
    <g class="step s2"><rect x="70" y="346" width="355" height="118" rx="23" fill="#173f40"/><circle cx="112" cy="385" r="22" fill="#315b5c"/><text x="100" y="393" font-size="23">✨</text><text x="149" y="382" class="eyebrow" fill="#ff9a57">02 · ASK</text><text x="149" y="415" class="label white">Open an accessible sheet</text><text x="149" y="440" class="small" fill="#cbd9d3">One-handed, keyboard-safe flow.</text></g>
    <g class="step s3"><rect x="70" y="490" width="355" height="118" rx="23" fill="#fffdfa" stroke="#d3ddd6"/><circle cx="112" cy="529" r="22" fill="#f3e2d5"/><text x="100" y="537" font-size="23">✅</text><text x="149" y="526" class="eyebrow" fill="#c54c18">03 · REVIEW</text><text x="149" y="559" class="label ink">Return to Shopify truth</text><text x="149" y="584" class="small muted">Variant, price, inventory and cart.</text></g>
    <path d="M438 260h70m-16-11 16 11-16 11M438 404h70m-16-11 16 11-16 11M438 548h70m-16-11 16 11-16 11" fill="none" stroke="#78918a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 9"/>
  </g>
  <g filter="url(#shadow)"><rect x="515" y="24" width="570" height="750" rx="67" fill="#0b3035"/><rect x="537" y="46" width="526" height="706" rx="54" fill="#fffdfa"/><rect x="714" y="35" width="172" height="26" rx="13" fill="#071e22"/></g>
  <g clip-path="url(#screen)" class="sans">
    <rect x="537" y="46" width="526" height="706" fill="#fffdfa"/><rect x="537" y="46" width="526" height="76" fill="url(#nav)"/><circle cx="581" cy="84" r="17" fill="#fff"/><path d="M581 71l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#e85d22"/><text x="610" y="91" class="label white">SEND FROM CHINA</text><circle cx="1018" cy="84" r="18" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="571" y="162" class="eyebrow" fill="#c54c18">PRODUCT</text><text x="571" y="197" class="serif ink" font-size="29">Walnut desk organizer</text><rect x="571" y="220" width="458" height="233" rx="24" fill="#e2e7dd"/><path d="M690 389h220v41H690zm38-120h144v125H728z" fill="#8d765f"/><circle cx="800" cy="326" r="27" fill="#b8c6b2"/><text x="571" y="492" class="label ink">$29.00</text><text x="571" y="522" class="small muted">Published catalog record</text><g class="tap"><rect x="571" y="558" width="458" height="58" rx="18" fill="#173f40"/><text x="735" y="593" class="label white">Ask Agent ✦</text></g>
    <g class="sheet">
      <rect x="537" y="116" width="526" height="636" rx="32" fill="#fffdf9" stroke="#cfd9d2"/><rect x="747" y="131" width="105" height="6" rx="3" fill="#b9c4bd"/><circle cx="579" cy="177" r="22" fill="#173f40"/><path d="M579 162l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#ff9857" class="spark"/><text x="616" y="170" class="eyebrow" fill="#c54c18">PRODUCT CONCIERGE</text><text x="616" y="198" class="serif ink" font-size="24">Shopping Agent</text><rect x="1000" y="153" width="38" height="38" rx="10" fill="#f1f0eb"/><path d="M1011 164l16 16m0-16l-16 16" stroke="#173f40" stroke-width="2"/>
      <g class="query"><rect x="566" y="225" width="468" height="57" rx="17" fill="#f0eee7"/><text x="587" y="248" class="eyebrow muted">YOU</text><text x="587" y="270" class="small ink">A practical desk gift under $40</text></g>
      <g class="reply"><text x="567" y="323" class="eyebrow" fill="#5e8366">SEND FROM CHINA</text><text x="567" y="351" class="label ink">One governed catalog match</text></g>
      <g class="card"><rect x="566" y="377" width="468" height="183" rx="20" fill="#f7f3eb" stroke="#d3dbd5"/><rect x="583" y="394" width="129" height="149" rx="14" fill="#e2e7dd"/><path d="M608 504h79v24h-79zm14-65h51v68h-51z" fill="#8b745e"/><text x="733" y="415" class="eyebrow" fill="#588064">CATALOG MATCH</text><text x="733" y="448" class="label ink">Desk organizer</text><text x="733" y="477" class="small muted">Published · compact</text><text x="733" y="520" class="serif ink" font-size="27">$29.00</text></g>
      <g class="handoff"><rect x="566" y="584" width="468" height="55" rx="16" fill="#173f40"/><text x="650" y="618" class="label white">View verified product</text><path d="M997 604l9 8-9 8" fill="none" stroke="#fff" stroke-width="3"/><text x="567" y="673" class="small muted">Shopify owns variant, price and cart truth.</text><rect x="566" y="694" width="368" height="28" rx="14" fill="#e7eee8"/><circle cx="585" cy="708" r="6" fill="#70a368"/><text x="600" y="713" class="small ink">Illustrative · no commerce write</text></g>
    </g>
  </g>
  <g class="sans"><rect x="1164" y="243" width="366" height="285" rx="28" fill="#fffdfa" stroke="#d3ddd6"/><text x="1202" y="287" class="eyebrow" fill="#c54c18">MOBILE BEHAVIOR</text><text x="1202" y="330" class="serif ink" font-size="31">A sheet, not a detour.</text><path d="M1202 366h288" stroke="#d8dfda"/><circle cx="1214" cy="402" r="7" fill="#76a36d"/><text x="1235" y="408" class="label ink">Product context retained</text><circle cx="1214" cy="446" r="7" fill="#ef8a4e"/><text x="1235" y="452" class="label ink">Explicit customer action</text><circle cx="1214" cy="490" r="7" fill="#31595b"/><text x="1235" y="496" class="label ink">Server-side credential</text></g>
</svg>
