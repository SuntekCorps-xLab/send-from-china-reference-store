<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Animated reference storefront architecture</title>
  <desc id="desc">A buyer moves through Shopify catalog and checkout, a browser-safe shopping-agent route through a server-side BFF to Agent Core, and an authenticated Customer Account route to a merchant API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f1e7"/><stop offset=".55" stop-color="#edf3ec"/><stop offset="1" stop-color="#efd9c8"/></linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12383c"/><stop offset="1" stop-color="#1e4b4c"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#14383a" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#55736e"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#e56f36"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.ink{fill:#0b3035}.muted{fill:#687671}.white{fill:#fff}.label{font-size:17px;font-weight:760}.small{font-size:13px;font-weight:600}.eyebrow{font-size:12px;font-weight:850;letter-spacing:2px}.route{fill:none;stroke:#55736e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);stroke-dasharray:10 11;animation:route 2.4s linear infinite}.return{stroke:#e56f36;marker-end:url(#arrowOrange);animation-direction:reverse}.node{transform-box:fill-box;transform-origin:center;animation:node 8s ease infinite}.d1{animation-delay:-7.2s}.d2{animation-delay:-6.3s}.d3{animation-delay:-5.4s}.d4{animation-delay:-4.5s}.d5{animation-delay:-3.6s}.d6{animation-delay:-2.7s}.d7{animation-delay:-1.8s}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.6s ease-in-out infinite}
      @keyframes route{to{stroke-dashoffset:-42}}@keyframes node{0%,12%,100%{opacity:.76;transform:scale(1)}4%,9%{opacity:1;transform:scale(1.025);filter:drop-shadow(0 0 10px #ef9b68)}}@keyframes spark{0%,100%{transform:scale(.85);opacity:.65}50%{transform:scale(1.14) rotate(12deg);opacity:1}}
      @media (prefers-reduced-motion:reduce){.route,.node,.spark{animation:none!important}.node{opacity:1}}
    </style>
  </defs>
  <rect width="1600" height="760" rx="38" fill="url(#bg)"/><circle cx="126" cy="100" r="150" fill="#e9834e" opacity=".2"/><circle cx="1490" cy="674" r="190" fill="#96ac93" opacity=".3"/>
  <g class="sans"><text x="58" y="70" class="eyebrow" fill="#c54c18">ONE STOREFRONT · THREE TRUSTED PATHS</text><text x="58" y="113" class="serif ink" font-size="38">The browser asks. Servers authorize. Shopify transacts.</text>
    <rect x="58" y="139" width="311" height="33" rx="16.5" fill="#fffdfa"/><circle cx="77" cy="155.5" r="6" fill="#df7139"/><text x="92" y="161" class="small ink">Browser-safe presentation</text><rect x="383" y="139" width="288" height="33" rx="16.5" fill="#dfe9e2"/><circle cx="402" cy="155.5" r="6" fill="#628c65"/><text x="417" y="161" class="small ink">Server-held credentials</text><rect x="685" y="139" width="282" height="33" rx="16.5" fill="#173f40"/><circle cx="704" cy="155.5" r="6" fill="#8db681"/><text x="719" y="161" class="small white">Shopify transaction truth</text>
  </g>
  <rect x="285" y="195" width="595" height="500" rx="30" fill="#fffdfa" opacity=".66" stroke="#ced9d1"/><rect x="900" y="195" width="642" height="500" rx="30" fill="url(#server)" opacity=".97"/><g class="sans"><text x="317" y="230" class="eyebrow" fill="#9b5b39">CUSTOMER SURFACES</text><text x="932" y="230" class="eyebrow" fill="#a9cfad">SERVER-SIDE TRUST BOUNDARY</text></g>
  <path d="M240 410H330" class="route"/><path d="M540 370C610 370 580 294 650 294" class="route"/><path d="M540 410H650" class="route"/><path d="M540 450C610 450 580 574 650 574" class="route"/><path d="M850 294H1120" class="route"/><path d="M850 410H940" class="route"/><path d="M1140 410H1242" class="route"/><path d="M1242 448H1140" class="route return"/><path d="M850 574H940" class="route"/><path d="M1140 574H1242" class="route"/>
  <g filter="url(#shadow)">
    <g class="node d1"><rect x="58" y="330" width="182" height="160" rx="28" fill="#fffdfa" stroke="#d1dbd4"/><circle cx="149" cy="382" r="31" fill="#f2e1d4"/><text x="132" y="394" class="emoji" font-size="34">👤</text><text x="111" y="441" class="sans label ink">Buyer</text><text x="87" y="466" class="sans small muted">One identity</text></g>
    <g class="node d2"><rect x="330" y="330" width="210" height="160" rx="28" fill="#fffdfa" stroke="#d1dbd4"/><circle cx="435" cy="382" r="31" fill="#e1ebe4"/><text x="418" y="394" class="emoji" font-size="34">🛍️</text><text x="367" y="441" class="sans label ink">Shopify storefront</text><text x="372" y="466" class="sans small muted">Browse in context</text></g>
    <g class="node d3"><rect x="650" y="250" width="200" height="88" rx="23" fill="#fffdfa" stroke="#d1dbd4"/><text x="678" y="286" class="emoji" font-size="27">🛒</text><text x="720" y="282" class="sans label ink">Product + cart</text><text x="720" y="309" class="sans small muted">Shopify state</text></g>
    <g class="node d3"><rect x="1120" y="250" width="350" height="88" rx="23" fill="#fffdfa" stroke="#d1dbd4"/><text x="1151" y="286" class="emoji" font-size="27">✅</text><text x="1194" y="282" class="sans label ink">Shopify-hosted checkout</text><text x="1194" y="309" class="sans small muted">Payment stays with Shopify</text></g>
    <g class="node d3"><rect x="650" y="366" width="200" height="88" rx="23" fill="#fffdfa" stroke="#d1dbd4"/><text x="678" y="402" class="emoji" font-size="27">✨</text><text x="720" y="398" class="sans label ink">Agent drawer</text><text x="720" y="425" class="sans small muted">No tenant key</text></g>
    <g class="node d4"><rect x="940" y="366" width="200" height="88" rx="23" fill="#244f50" stroke="#61807c"/><text x="968" y="402" class="emoji" font-size="27">🔐</text><text x="1010" y="398" class="sans label white">Storefront BFF</text><text x="1010" y="425" class="sans small" fill="#c8d8d2">Scoped adapter</text></g>
    <g class="node d5"><rect x="1242" y="366" width="228" height="88" rx="23" fill="#fffdfa"/><circle cx="1281" cy="410" r="24" fill="#173f40"/><path d="M1281 396l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ff9857" class="spark"/><text x="1318" y="398" class="sans label ink">Agent Core</text><text x="1318" y="425" class="sans small muted">Governed discovery</text></g>
    <g class="node d3"><rect x="650" y="530" width="200" height="88" rx="23" fill="#fffdfa" stroke="#d1dbd4"/><text x="678" y="566" class="emoji" font-size="27">👤</text><text x="720" y="562" class="sans label ink">Customer Account</text><text x="720" y="589" class="sans small muted">Shopify identity</text></g>
    <g class="node d6"><rect x="940" y="530" width="200" height="88" rx="23" fill="#244f50" stroke="#61807c"/><text x="968" y="566" class="emoji" font-size="27">🧩</text><text x="1010" y="562" class="sans label white">Extensions</text><text x="1010" y="589" class="sans small" fill="#c8d8d2">Authorized UI</text></g>
    <g class="node d7"><rect x="1242" y="530" width="228" height="88" rx="23" fill="#fffdfa"/><text x="1272" y="566" class="emoji" font-size="27">🏢</text><text x="1315" y="562" class="sans label ink">Merchant API</text><text x="1315" y="589" class="sans small muted">Account-bound state</text></g>
  </g>
  <g class="sans"><rect x="58" y="710" width="1484" height="28" rx="14" fill="#ecebe5"/><circle cx="81" cy="724" r="6" fill="#72a269"/><text x="97" y="729" class="small ink">Credentialed calls cross the BFF · catalog browsing and purchase evidence remain separate · no payment data enters the agent</text></g>
</svg>
