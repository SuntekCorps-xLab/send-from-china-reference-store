name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  customer-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shopify-customer-account/package-lock.json
      - name: Install locked dependencies
        working-directory: shopify-customer-account
        run: npm ci
      - name: Create non-deployable test config
        working-directory: shopify-customer-account
        run: cp shopify.app.toml.example shopify.app.toml
      - name: Test and build
        working-directory: shopify-customer-account
        run: |
          mkdir -p ../artifacts
          npm test 2>&1 | tee ../artifacts/customer-account-tests.log
          npm run check -- --no-color 2>&1 | tee ../artifacts/customer-account-build.log
      - name: Upload account evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: customer-account-verification
          path: artifacts/

  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@4.6.0
      - name: Theme check
        run: shopify theme check --path shopify-theme --fail-level error
      - name: Storefront contract tests
        run: node --test shopify-theme/tests/*.test.mjs
      - name: Browser contract QA
        run: node shopify-theme/tests/run-agent-drawer-browser-qa.mjs

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan repository
        run: node scripts/scan-public.mjs .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
